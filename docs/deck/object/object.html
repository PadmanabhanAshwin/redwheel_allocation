or="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Task</tspan> i: an operation with N runs per period. A run</text><text x="448" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">consumes and yields resources at offsets θ: one</text><text x="448" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">resource into another, or the same one released</text><text x="430" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edge</tspan> (i, r): amount μ per run (&lt; 0 consumed,</text><text x="448" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">&gt; 0 yielded) at offset θ</text><text x="430" y="497" text-anchor="start" style="font-size:22px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> = <tspan style="font-family:Times,serif;font-style:italic">c</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i</tspan><tspan dy="-7" style="font-size:10px"> </tspan>Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> μ <tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i,t−θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + <tspan style="font-family:Times,serif;font-style:italic">π</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan>,   <tspan style="font-family:Times,serif;font-style:italic">X</tspan> ≥ 0</text><text x="430" y="530" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">c: 1 for stock and orders, 0 for capacity · π: arrivals</text><rect x="420" y="586" width="410" height="204" rx="8" fill="#f3f4f6"/><text x="432" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="432" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">74 resources, 80 tasks, 180 edges</text><text x="432" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">121 weekly periods from 7 Sep 2026</text><text x="432" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Detail on the next slide</text><path class="wire" marker-end="url(#a)" d="M840 511.0 L877 511.0"/><rect x="880" y="222" width="330" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="900" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Scenario</text><text x="900" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">edits to 𝒪, rules, objective</text><text x="900" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edits to 𝒪</tspan>: opening levels, arrivals,</text><text x="918" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">run limits, delays θ</text><text x="900" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Rules</tspan>: permitted routes; task kinds</text><text x="918" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">the solver decides</text><text x="900" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Objective</tspan>: stock targets; priority</text><text x="918" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">order as ordered steps</text><text x="900" y="464" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Examples</text><text x="918" y="487" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">build time 2 weeks: delay θ</text><text x="918" y="510" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">closed for Christmas: capacity = 0</text><text x="918" y="533" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">RW-9304 first: priority order</text><rect x="890" y="586" width="310" height="204" rx="8" fill="#f3f4f6"/><text x="902" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="902" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">7 scenarios</text><text x="902" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">A, R, R+: build time none, 1 wk,</text><text x="918" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">by model; R+ is the plan</text><text x="902" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">On R+: Christmas closure, fleet</text><text x="918" y="734" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">order, lots of 50, priority order</text><path class="wire" marker-end="url(#a)" d="M1210 511.0 L1247 511.0"/><rect x="1250" y="222" width="290" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="1270" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Solver</text><text x="1270" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">method 00">four lines.</text><text x="1060" y="374" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Even rule.</text><text x="1420" y="374" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">All targets held from 20 Sep 2027 (+2</text><text x="1420" y="398" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">weeks).</text><rect x="96" y="420" width="1728" height="70" rx="8" fill="rgb(249,241,235)"/><text x="110" y="444" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:700">R+</text><text x="220" y="444" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Two weeks on carbon lines, one on base</text><text x="220" y="468" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">lines. The build plan.</text><text x="640" y="444" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Make output entry in A₂ on carbon lines, A₁</text><text x="640" y="468" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">on base lines.</text><text x="1060" y="444" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Even rule.</text><text x="1420" y="444" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">94,429 bikes; all targets held from 4 Oct</text><text x="1420" y="468" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">2027 (+2 weeks).</text><line x1="110" y1="496" x2="1810" y2="496" stroke="#e5e7eb" stroke-width="1.5"/><text x="110" y="522" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:700">R+C26</text><text x="220" y="522" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">All lines closed in the weeks of 21 and 28</text><text x="220" y="546" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Dec 2026.</text><text x="640" y="522" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">π: capacity arrival 0 on 4 lines × 2 weeks</text><text x="640" y="546" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">(8 entries).</text><text x="1060" y="522" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Even rule.</text><text x="1420" y="522" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Up to 724 MTB carbon bikes owed in Jan</text><text x="1420" y="546" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">2027; targets held from 25 Oct 2027 (+3</text><text x="1420" y="570" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">weeks).</text><text x="110" y="616" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:700">R+E4</text><text x="220" y="616" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Commercial order for 300 RW-4418 in the week</text><text x="220" y="640" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">of 9 Nov 2026.</text><text x="640" y="616" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">π: order arrival +300 on RW-4418, commercial</text><text x="640" y="640" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">channel (1 entry).</text><text x="1060" y="616" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Even rule.</text><text x="1420" y="616" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">94,729 bikes (+300); MTB carbon target</text><text x="1420" y="640" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">held 11 Oct 2027 (+1 week).</text><text x="110" y="686" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:700">R+E5</text><text x="220" y="686" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">RW-9304 built in whole lots of 50.</text><text x="640" y="686" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Lot size 50 on make RW-9304, applied when</text><text x="640" y="710" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">the LP solution is rounded.</text><text x="1060" y="686" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Even rule.</text><text x="1420" y="686" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">RW-9304 total 16,300 (+33); no target date</text><text x="1420" y="710" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">moves.</text><text x="110" y="756" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:700">R+P1</text><text x="220" y="756" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Priority order on the MTB carbon line.</text><text x="640" y="756" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">None.</text><text x="1060" y="756" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Six steps, each minimised then held:</text><text x="1060" y="780" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">past-due orders; open orders; target</text><text x="1060" y="804" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">for RW-9304, RW-4418, RW-6416 in turn;</text><text x="1060" y="828" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">target for the rest.</text><text x="1420" y="756" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">RW-9304 at target 31 May 2027, RW-4418 13</text><text x="1420" y="780" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">Sep, RW-6416 4 Oct; line dates as R+.</text><line x1="110" y1="856" x2="1810" y2="856" stroke="#e5e7eb" stroke-width="1.5"/><text x="110" y="882" text-anchor="start" style="font-size:19px;fill:#6b7280;font-weight:700">Test</text><text x="220" y="882" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Bought frame with a 2-week lead time; small</text><text x="220" y="906" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">test network, not Redwheel data.</text><text x="640" y="882" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">One new resource row (frames), one new task</text><text x="640" y="906" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">column (buy); its +1 in A₂.</text><text x="1060" y="882" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Even rule.</text><text x="1420" y="882" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Builds 3, 0, 9, 4 in weeks 1–4.</text><text x="1810" y="1048" class="pg" text-anchor="end">6 / 12</text></svg><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text x="110" y="112" class="h1">Scenarios A, R and R+</text><text x="110" y="164" class="sub">The same network and solver with three settings of build time. R+ is the plan.</text><line x1="110" y1="200" x2="1810" y2="200" stroke="#e5e7eb" stroke-width="2"/><rect x="110.0" y="226" width="542.6666666666666" height="104" rx="12" fill="rgb(249,242,237)"/><text x="132.0" y="282" text-anchor="start" style="font-size:38px;fill:#111827;font-weight:700">94,429</text><text x="132.0" y="312" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">bikes in each scenario; identical totals per bike</text><rect x="676.6666666666666" y="226" width="542.6666666666666" height="104" rx="12" fill="rgb(249,242,237)"/><text x="698.6666666666666" y="282" text-anchor="start" style="font-size:38px;fill:#111827;font-weight:700">+2 weeks</text><text x="698.6666666666666" y="312" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">per scenario on every target date: 6 Sep, 20 Sep, 4 Oct 2027</text><rect x="1243.3333333333333" y="226" width="542.6666666666666" height="104" rx="12" fill="rgb(249,242,237)"/><text x="1265.3333333333333" y="282" text-anchor="start" style="font-size:38px;fill:#111827;font-weight:700">Carbon lines only</text><text x="1265.3333333333333" y="312" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">shift from R to R+; base lines unchanged</text><text x="110" y="400" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">SCENARIO CONTEXT</text><circle cx="114" cy="426" r="3.2" fill="#111827"/><text x="130" y="432" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">One network, one solver, one objective; three</text><text x="130" y="459" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">settings of build time.</text><circle cx="114" cy="487" r="3.2" fill="#111827"/><text x="130" y="493" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400"><tspan font-weight="700">A</tspan>: none. A bike ships in the week it is built.</text><circle cx="114" cy="521" r="3.2" fill="#111827"/><text x="130" y="527" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400"><tspan font-weight="700">R</tspan>: one week, every line.</text><circle cx="114" cy="555" r="3.2" fill="#111827"/><text x="130" y="561" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400"><tspan font-weight="700">R+</tspan>: two weeks on carbon lines, one on base lines.</text><text x="110" y="615" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">ASSUMPTIONS</text><circle cx="114" cy="641" r="3.2" fill="#111827"/><text x="130" y="647" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Build times are assumptions; the data contains no</text><text x="130" y="674" text-an
