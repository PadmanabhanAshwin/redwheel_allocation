<text x="240" y="690" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Summed over weeks <tspan style="font-family:Times,serif;font-style:italic">t</tspan> and production lines <tspan style="font-family:Times,serif;font-style:italic">g</tspan>: the largest shortfall <tspan style="font-family:Times,serif;font-style:italic">u</tspan> among the</text><text x="240" y="712" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">SKUs <tspan style="font-family:Times,serif;font-style:italic">k</tspan> built on <tspan style="font-family:Times,serif;font-style:italic">g</tspan>. Second term: 0.1 × the sum of all shortfalls.</text><text x="110" y="752" text-anchor="start" style="font-size:23px;fill:#6b7280;font-family:Times,serif">subject to</text><text x="240" y="752" text-anchor="start" style="font-size:27px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> = C<tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + <tspan fill="#b45309">A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">0</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></tspan> + <tspan fill="#2563eb">A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">1</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan></tspan> + <tspan style="font-family:Times,serif;font-style:italic">π</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="240" y="782" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">State equation. <tspan style="font-family:Times,serif;font-style:italic">X</tspan>: resource levels. <tspan style="font-family:Times,serif;font-style:italic">N</tspan>: task runs. C: diagonal carry matrix.</text><text x="240" y="804" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">0</tspan><tspan dy="-7" style="font-size:10px"> </tspan>, A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">1</tspan><tspan dy="-7" style="font-size:10px"> </tspan>: edge amounts by delay. π: exogenous arrivals.</text><text x="110" y="844" text-anchor="start" style="font-size:23px;fill:#6b7280;font-family:Times,serif"></text><text x="240" y="844" text-anchor="start" style="font-size:27px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> ≥ 0, 0 ≤ <tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> ≤ <tspan style="font-family:Times,serif;font-style:italic;text-decoration:overline">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="240" y="874" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400"><tspan style="font-family:Times,serif;font-style:italic">X</tspan> ≥ 0 bounds capacity use (C = 0) and keeps stock non-negative (C = 1).</text><text x="240" y="896" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400"><tspan style="font-family:Times,serif;font-style:italic;text-decoration:overline">N</tspan>: run limit per task and week.</text><text x="110" y="936" text-anchor="start" style="font-size:23px;fill:#6b7280;font-family:Times,serif">where</text><text x="240" y="936" text-anchor="start" style="font-size:27px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">u</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> = max(0, <tspan style="font-family:Times,serif;font-style:italic">target</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> − <tspan style="font-family:Times,serif;font-style:italic">net</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan>) / <tspan style="font-family:Times,serif;font-style:italic">d</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="240" y="966" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Shortfall of SKU <tspan style="font-family:Times,serif;font-style:italic">k</tspan> below target in week <tspan style="font-family:Times,serif;font-style:italic">t</tspan>, in weeks of demand. net: stock minus</text><text x="240" y="988" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">open orders, linear in <tspan style="font-family:Times,serif;font-style:italic">X</tspan>. <tspan style="font-family:Times,serif;  plan</text><text x="1116" y="723" text-anchor="start" style="font-size:18px;fill:#111827;font-family:Times,serif">A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">1</tspan><tspan dy="-7" style="font-size:10px"> </tspan>, A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">2</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="1206" y="723" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">output entry of make in A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">2</tspan><tspan dy="-7" style="font-size:10px"> </tspan> for carbon, A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">1</tspan><tspan dy="-7" style="font-size:10px"> </tspan> for base</text><text x="1040" y="752" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:700">R+C26</text><text x="1116" y="752" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Plant closed, weeks of 21 and 28 Dec 2026</text><text x="1810" y="752" text-anchor="end" style="font-size:15px;fill:#6b7280;font-weight:400">live</text><text x="1116" y="775" text-anchor="start" style="font-size:18px;fill:#111827;font-family:Times,serif">π</text><text x="1206" y="775" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">capacity arrival set to 0, every line, 2 weeks</text><text x="1040" y="804" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:700">R+E4</text><text x="1116" y="804" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Commercial order, 300 RW-4418, week of 9 Nov 2026</text><text x="1810" y="804" text-anchor="end" style="font-size:15px;fill:#6b7280;font-weight:400">live</text><text x="1116" y="827" text-anchor="start" style="font-size:18px;fill:#111827;font-family:Times,serif">π</text><text x="1206" y="827" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">order arrival +300 in 1 week</text><text x="1040" y="856" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:700">R+P1</text><text x="1116" y="856" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Priority order on the MTB carbon line</text><text x="1810" y="856" text-anchor="end" style="font-size:15px;fill:#6b7280;font-weight:400">live</text><text x="1116" y="879" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">objective</text><text x="1206" y="879" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">one step replaced by six ordered steps</text><text x="1040" y="908" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:700">R+E5</text><text x="1116" y="908" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">RW-9304 built in lots of 50</text><text x="1810" y="908" text-anchor="end" style="font-size:15px;fill:#6b7280;font-weight:400">live; outside the LP</text><text x="1116" y="931" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">lot</text><text x="1206" y="931" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">applied when rounding the LP solution; exact form is a MIP</text><text x="1040" y="960" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:700"></text><text x="1116" y="960" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Purchased component, 2-week lead time</text><text x="1810" y="960" text-anchor="end" style="font-size:15px;fill:#6b7280;font-weight:400">test only</text><text x="1116" y="983" text-anchor="start" style="font-size:18px;fill:#111827;font-family:Times,serif">A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">0</tspan><tspan dy="-7" style="font-size:10px"> </tspan>, A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">2</tspan><tspan dy="-7" style="font- t" style="font-size:18px;fill:#111827;font-weight:400">are set by us.</text><text x="110" y="569" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Stock at Reno and the PDC serves every order: the</text><text x="110" y="596" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">order files record no ship-from site.</text><text x="110" y="631" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Orders ship as soon as stock exists, oldest first.</text><text x="110" y="688" text-anchor="start" style="font-size:20px;fill:#111827;font-weight:700">Result notes</text><text x="110" y="722" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">All three build the same 94,429 bikes, the same</text><text x="110" y="749" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">total per bike. Build time changes only when they arrive.</text><text x="110" y="784" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Each step clears the last open order two weeks later.</text><text x="110" y="819" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">From R to R+, only the carbon lines move.</text><line x1="680" y1="226" x2="680" y2="990" stroke="#e5e7eb" stroke-width="2"/><text x="730" y="250" text-anchor="start" style="font-size:20px;fill:#111827;font-weight:400"><tspan font-weight="700">Open orders at month end</tspan><tspan style="fill:#6b7280"> all lines, bikes owed to customers</tspan></text><line x1="790" y1="560.0" x2="1790" y2="560.0" stroke="#e5e7eb" stroke-width="1"/><text x="780" y="565.0" text-anchor="end" style="font-size:14px;fill:#6b7280;font-weight:400">0</text><line x1="790" y1="508.0" x2="1790" y2="508.0" stroke="#e5e7eb" stroke-width="1"/><text x="780" y="513.0" text-anchor="end" style="font-size:14px;fill:#6b7280;font-weight:400">1,000</text><line x1="790" y1="456.0" x2="1790" y2="456.0" stroke="#e5e7eb" stroke-width="1"/><text x="7
