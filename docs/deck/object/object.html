.pg{font-size:18px;fill:#9ca3af}</style></head><body><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker></defs><text x="110" y="112" class="h1">The object: Redwheel as a resource–task network</text><text x="110" y="196" class="st"><tspan class="b">1. It is generated from master data.</tspan></text><text x="110" y="234" class="st">Every SKU × location that holds stock or orders is a resource,</text><text x="110" y="272" class="st">plus one capacity resource per line. Every routing row is a</text><text x="110" y="310" class="st">make task; every route is a move or a fulfil task.</text><text x="110" y="348" class="st"><tspan class="dim" style="fill:#6b7280">→ 74 resources, 80 tasks, 180 edges for 10 SKUs.</tspan></text><text x="990" y="196" class="st"><tspan class="b">2. Every edge is one cause-and-effect link.</tspan></text><text x="990" y="234" class="st">Running a task changes a resource’s level by a signed amount,</text><text x="990" y="272" class="st">after a delay. Levels change in only two ways: through an edge,</text><text x="990" y="310" class="st">or by an external arrival (forecast orders, weekly capacity).</text><text x="990" y="348" class="st"><tspan style="fill:#6b7280">So any effect can be traced back along edges to its cause.</tspan></text><line x1="110" y1="392" x2="1810" y2="392" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="432" class="tag">SUBGRAPH FOR ONE SKU · RW-4418 · OPENING STATE 7 SEP 2026</text><rect class="res" x="110" y="680" width="290" height="120" rx="22"/><text x="136" y="728" class="name">MTB carbon line</text><text x="136" y="778" class="num">375 / wk</text><path class="wire" marker-end="url(#a)" d="M400 740 L446 740"/><text x="423.0" y="718" class="amt" text-anchor="middle">−1</text><rect class="task" x="450" y="680" width="180" height="120" rx="8"/><text x="540.0" y= <text x="1526" y="754" class="note">Forecast</text><text x="1784" y="754" class="note" text-anchor="end">+50 / wk</text><line x1="110" y1="850" x2="1810" y2="850" stroke="#e5e7eb" stroke-width="2"/><rect class="res" x="110" y="893" width="46" height="34" rx="10"/><text x="172" y="919" class="note"><tspan class="b" fill="#111827">Resource node.</tspan> A level per week: inventory, open orders, capacity.</text><rect class="task" x="110" y="943" width="46" height="34" rx="5"/><text x="172" y="969" class="note"><tspan class="b" fill="#111827">Task node.</tspan> A number of runs per week. The plan decides make and move; fulfil is assumed: orders ship as stock allows.</text><path class="wire" marker-end="url(#a)" d="M110 1010 L154 1010"/><text x="172" y="1018" class="note"><tspan class="b" fill="#111827">Edge.</tspan> Task to resource, with an amount per run and a delay in weeks (0 unless shown).</text><text x="1810" y="1048" class="pg" text-anchor="end">1</text></svg><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker></defs><text x="110" y="112" class="h1">Every level follows one balance equation</text><text x="110" y="190" class="mono">level[r, t]  =  carry[r] · level[r, t−1]  +  Σ amount[e] · runs[task(e), t − delay(e)]  +  arrival[r, t]</text><text x="110" y="234" class="note">Sum over the edges e that end at resource r.  carry = 1 for inventory and orders, 0 for capacity.  level ≥ 0, so a line cannot overbuild.</text><line x1="110" y1="278" x2="1810" y2="278" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="324" class="tag">WORKED: MTB CARBON LINE · WEEK OF 21 SEP 2026 (t = 3) · RUNS FROM THE PLAN · INVENTORY BEFORE ORDERS SHIP</text><rect class="res" x="110" y="487" width="400" height="170" rx="22"/><text x="136" y="534" class="name">MTB carbon line</text><text x="136" y="588" class="num">375 <tspan class="dim">→</tspan> 0</text><text x="136" y="628" class="note">arrives → left after runs</text><path class="wire" marker-end="url(#a)" d="M510 544 C600 544 610 452 696 452"/><path class="wire" marker-end="url(#a)" d="M510 572 L696 572"/><path class="wire" marker-end="url(#a)" d="M510 600 C600 600 610 692 696 692"/><text x="640" y="434" class="amt" text-anchor="end">−1</text><text x="640" y="558" class="amt" text-anchor="end">−1</text><text x="640" y="730" class="amt" text-anchor="end">−1</text><rect class="task" x="700" y="404" width="320" height="96" rx="8"/><text x="724" y="440" class="tname" style="font-size:21px">make RW-4418</text><text x="724" y="482" class="tnum">142 runs</text>

<rect class="res" x="1220" y="644" width="590" height="96" rx="22"/><text x="1246" y="701" class="name">RW-9304 at Reno</text><text x="1784" y="705" class="num" text-anchor="end">425 <tspan class="dim">→</tspan> 569</text><text x="980" y="800" class="colh" text-anchor="end">carry · level[t−1]</text><text x="1330" y="800" class="colh" text-anchor="end">Σ amount · runs</text><text x="1560" y="800" class="colh" text-anchor="end">arrival[t]</text><text x="1790" y="800" class="colh" text-anchor="end">= level[t]</text><text x="110" y="850" class="st"><tspan class="b">MTB carbon line</tspan>  <tspan style="fill:#6b7280;font-size:23px">capacity, carry 0</tspan></text><text x="980" y="850" class="cell" text-anchor="end">0</text><text x="1330" y="850" class="cell" text-anchor="end">−142 −89 −144</text><text x="1560" y="850" class="cell" text-anchor="end">+375</text><text x="1790" y="850" class="cell" text-anchor="end">= 0</text><text x="110" y="900" class="st"><tspan class="b">RW-4418 at Reno</tspan>  <tspan style="fill:#6b7280;font-size:23px">inventory, carry 1</tspan></text><text x="980" y="900" class="cell" text-anchor="end">247</text><text x="1330" y="900" class="cell" text-anchor="end">+142</text><text x="1560" y="900" class="cell" text-anchor="end">0</text><text x="1790" y="900" class="cell" text-anchor="end">= 389</text><line x1="110" y1="940" x2="1810" y2="940" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="992" class="st">74 resources × 121 weeks = 8,954 of these rows. They are the constraints the solver receives; the runs are its decision variables.</text><text x="1810" y="1048" class="pg" text-anchor="end">2</text></svg><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker></defs><text x="110" y="112" class="h1">Why nodes and edges are enough</text><text x="110" y="168" class="st">Slide 2 gave one equation and one bound: level ≥ 0. Applied to the graph, they produce the four interactions a supply chain is made of.</text><line x1="110" y1="204" x2="1810" y2="204" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="262" class="st"><tspan class="b">1. Series</tspan>  <tspan style="fill:#b45309;font-weight:700">→ dependency</tspan></text><rect class="task" x="110" y="348.0" width="130" height="72" rx="6"/><text x="175.0" y="393" class="tnum" style="font-size:25px" text-anchor="middle">make</text><path class="wire" marker-end="url(#a)" d="M240 384 L306 384"/><text x="275.0" y="372" class="amt" style="font-size:21px" text-anchor="middle">+1</text><rect class="res" x="310" y="348" width="200" height="72" rx="16"/><text x="326" y="378" class="name" style="font-size:19px">Reno stock</text><text x="326" y="408" class="num" style="font-size:25px">25</text><path class="wire" marker-end="url(#a)" d="M510 384 L576 384"/><text x="545.0" y="372" class="amt" style="font-size:21px" text-anchor="middle">−1</text><rect class="task" x="580" y="348.0" width="130" height="72" rx="6"/><text x="645.0" y="393" class="tnum" style="font-size:25px" text-anchor="middle">move</text><text x="110" y="502" class="note">Reno stock cannot go below zero, so move can send on only</text><text x="110" y="534" class="note">what is there: 25 bikes on 7 Sep, plus whatever make adds.</text><text x="110" y="570" class="note" style="fill:#111827">Upstream limits downstream.</text><text x="1000" y="262" class="st"><tspan class="b">2. Shared input</tspan>  <tspan style="fill:#b45309;font-weight:700">→ competition</tspan></text><rect class="res" x="1000" y="348" width="210" height="72" rx="16"/><text x="1016" y="378" class="name" style="font-size:19px">MTB carbon line</text><text x="1016" y="408" class="num" style="font-size:25px">375 / wk</text><path class="wire" marker-end="url(#a)" d="M1210 370 C1255 370 1275 326 1326 326"/><path class="wire" marker-end="url(#a)" d="M1210 384 C1255 384 1275 384 1326 384"/><path class="wire" marker-end="url(#a)" d="M1210 398 C1255 398 1275 442 1326 442"/><rect class="task" x="1330" y="303.0" width="250" height="46" rx="6"/><text x="1344" y="333" class="tname" style="font-size:19px;fill:#fff">make RW-4418</text><text x="1566" y="334" class="tnum" style="font-size:22px" text-anchor="end">142</text><rect class="task" x="1330" y="361.0" width="250" height="46" rx="6"/><text x="1344" y="391" class="tname" style="font-size:19px;fill:#fff">make RW-6416</text><text x="1566" y="392" class="tnum" style="font-size:22px" text-anchor="end">89</text><rect class="task" x="1330" y="419.0" width="250" height="46" rx="6"/><text x="1344" y="449" class="tname" style="font-size:19px;fill:#fff">make RW-9304</text><text x="1566" y="450" class="tnum" style="font-size:22px" text-anchor="end">144</text><text x="1270" y="332" class="amt" style="font-size:21px" text-anchor="middle">−1</text><text x="1000" y="502" class="note">Three tasks draw on one resource that cannot go below</text><text x="1000" y="534" class="note">zero: 142 + 89 + 144 = 375. One more of one is one less of another.</text><text x="1000" y="570" class="note" style="fill:#111827">SKUs compete for a line.</text><line x1="110" y1="608" x2="1810" y2="608" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="666" class="st"><tspan class="b">3. Joint input</tspan>  <tspan style="fill:#b45309;font-weight:700">→ matching</tspan></text><rect class="res" x="110" y="708" width="200" height="72" rx="16"/><text x="126" y="738" class="name" style="font-size:19px">Line capacity</text><text x="126" y="768" class="num" style="font-size:25px">has room</text><rect class="res" x="110" y="796" width="200" height="72" rx="16"/><text x="126" y="826" class="name" style="font-size:19px">Frames on hand</text><text x="126" y="856" class="num" style="font-size:25px">3</text><path class="wire" marker-end="url(#a)" d="M310 744 L436 776"/><text x="375.0" y="744" class="amt" style="font-size:21px" text-anchor="middle">−1</text><path class="wire" marker-end="url(#a)" d="M310 832 L436 800"/><text x="375.0" y="850" class="amt" style="font-size:21px" text-anchor="middle">−1</text><rect class="task" x="440" y="752.0" width="130" height="72" rx="6"/><text x="505.0" y="797" class="tnum" style="font-size:25px" text-anchor="middle">make</text><text x="110" y="906" class="note">make takes one build and one frame. Frames have a two-week lead</text><text x="110" y="938" class="note">time, so builds run 3, 0, 9, 4: none in week 2, though the line has room.</text><text x="110" y="974" class="note" style="fill:#111827">The scarcer input sets the pace. Tested on a small example, not Redwheel’s data.</text><text x="1000" y="666" class="st"><tspan class="b">4. Delay</tspan>  <tspan style="fill:#b45309;font-weight:700">→ lag</tspan></text><rect class="res" x="1000" y="752" width="200" height="72" rx="16"/><text x="1016" y="782" class="name" style="font-size:19px">Reno, week t</text><text x="1016" y="812" class="num" style="font-size:25px">−1</text><path class="wire" marker-end="url(#a)" d="M1200 788 L1266 788"/><rect class="task" x="1270" y="752.0" width="130" height="72" rx="6"/><text x="1335.0" y="797" class="tnum" style="font-size:25px" text-anchor="middle">move</text><path class="wire" marker-end="url(#a)" d="M1400 788 L1526 788"/><text x="1465.0" y="776" class="amt" style="font-size:21px" text-anchor="middle">+1, 1 wk</text><rect class="res" x="1530" y="752" width="260" height="72" rx="16"/><text x="1546" y="782" class="name" style="font-size:19px">Columbus, week t+1</text><text x="1546" y="812" class="num" style="font-size:25px">+1</text><text x="1000" y="906" class="note">One run of move leaves Reno now and reaches Columbus</text><text x="1000" y="938" class="note">a week later. In between it is counted as in-transit stock.</text><text x="1000" y="974" class="note" style="fill:#111827">Lead time, with nothing lost on the way.</text><line x1="110" y1="1004" x2="1810" y2="1004" stroke="#e5e7eb" stroke-w font-size:16px;fill:#6b7280">week 3</text><rect x="1036" y="530" width="72" height="108.5" fill="#111827"/><text x="1072" y="592.0" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#fff">10</text><text x="1072" y="666" text-anchor="middle" style="font-size:16px;fill:#6b7280">week 4</text><line x1="712" y1="640" x2="1120" y2="640" stroke="#111827" stroke-width="2"/><text x="1220" y="570" class="st" style="font-size:24px">Y fills its stock first.</text><text x="1220" y="606" class="st" style="font-size:24px">X’s customers wait until week 3.</text><line x1="110" y1="694" x2="1810" y2="694" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="776" style="font-size:26px;font-weight:700;fill:#111827">Customers, then Y first</text><text x="110" y="814" class="cell" style="font-size:20px">1. owed   · both bikes · shared evenly</text><text x="110" y="846" class="cell" style="font-size:20px">2. target · Y</text><text x="110" y="878" class="cell" style="font-size:20px">3. target · X</text><rect x="724" y="750" width="72" height="108.5" fill="#111827"/><text x="760" y="812.0" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#fff">10</text><text x="760" y="886" text-anchor="middle" style="font-size:16px;fill:#6b7280">week 1</text><rect x="828" y="750" width="72" height="108.5" fill="#b45309"/><text x="864" y="812.0" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#fff">10</text><text x="864" y="886" text-anchor="middle" style="font-size:16px;fill:#6b7280">week 2</text><rect x="932" y="750" width="72" height="108.5" fill="#b45309"/><text x="968" y="812.0" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#fff">10</text><text x="968" y="886" text-anchor="middle" style="font-size:16px;fill:#6b7280">week 3</text><rect x="1036" y="750" width="72" height="108.5" fill="#111827"/><text x="1072" y="812.0" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#fff">10</text><text x="1072" y="886" text-anchor="middle" style="font-size:16px;fill:#6b7280">week 4</text><line x1="712" y1="860" x2="1120" y2="860" stroke="#111827" stroke-width="2"/><text x="1220" y="790" class="st" style="font-size:24px">X’s customers are served in week 1.</text><text x="1220" y="826" class="st" style="font-size:24px">Then Y gets its stock before X.</text><line x1="110" y1="914" x2="1810" y2="914" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="966" class="st">A priority has two parts: which need comes first, then which bike. “Owed” is the floor at zero: nobody waiting.</text><text x="110" y="1010" class="note">Each row is a test of the solver. On Redwheel, today’s rule written as a one-step priority order gives the same plan, cell for cell.</text><text x="1810" y="1048" class="pg" text-anchor="end">6</text></svg></body></html>
