xt-anchor="start" style="font-size:21px;fill:#111827;font-weight:700">Linear program</text><text x="700" y="702" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">how the network becomes</text><text x="700" y="724" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">the program</text><rect x="965" y="600" width="262" height="150" rx="12" fill="rgb(249,242,237)"/><text x="985" y="640" text-anchor="start" style="font-size:16px;fill:#b45309;font-weight:700">5</text><text x="985" y="672" text-anchor="start" style="font-size:21px;fill:#111827;font-weight:700">Priority order</text><text x="985" y="702" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">what the plan protects</text><text x="985" y="724" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">first</text><rect x="1250" y="600" width="262" height="150" rx="12" fill="rgb(249,242,237)"/><text x="1270" y="640" text-anchor="start" style="font-size:16px;fill:#b45309;font-weight:700">6–7</text><text x="1270" y="672" text-anchor="start" style="font-size:21px;fill:#111827;font-weight:700">The plan</text><text x="1270" y="702" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">build time, and scenario</text><text x="1270" y="724" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">R+</text><rect x="1535" y="600" width="262" height="150" rx="12" fill="rgb(249,242,237)"/><text x="1555" y="640" text-anchor="start" style="font-size:16px;fill:#b45309;font-weight:700">8–12</text><text x="1555" y="672" text-anchor="start" style="font-size:21px;fill:#111827;font-weight:700">Scenarios</text><text x="1555" y="702" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">the full set; R+ against</text><text x="1555" y="724" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">each change</text><text x="110" y="900" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">Every number on these slides is read from docs/deck/deck_numbers.json, written by one run of every scenario through the product, with every plan check passing.</text><text x="110" y="928" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">16 November 2026.</text></svg><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text x="110" y="112" class="h1">Planning system</text><text x="110" y="164" class="sub">Five parts, one object. Every scenario is an edit to the object; the solver and the plan follow from it.</text><line x1="110" y1="200" x2="1810" y2="200" stroke="#e5e7eb" stroke-width="2"/><rect x="110" y="222" width="260" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="130" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Data</text><text x="130" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">inputs</text><text x="130" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Part master</text><text x="130" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Locations, routes</text><text x="130" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Inventory by location</text><text x="130" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Open orders, due dates</text><text x="130" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Demand forecast</text><text x="130" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Capacity</text><text x="130" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Lead times, targets</text><rect x="120" y="586" width="240" height="204" rx="8" fill="#f3f4f6"/><text x="132" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="132" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">10 SKUs on 4 lines</text><text x="132" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">2 sites, 3 channels</text><text x="132" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Routes and lead times</text><text x="132" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">assumed</text><path class="wire" marker-end="url(#a)" d="M370 511.0 L407 511.0"/><rect x="410" y="222" width="430" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="430" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Object  𝒪</text><text x="430" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">resource–task network</text><text x="430" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Resource</tspan> r: a quantity with a level X per period</text><text x="448" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">inventory, open orders, capacity</text><text x="430" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Task</tspan> i: an operation with N runs per period. A run</text><text x="448" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">consumes and yields resources at offsets θ: one</text><text x="448" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">resource into another, or the same one released</text><text x="430" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edge</tspan> (i, r): amount μ per run (&lt; 0 consumed,</text><text x="448" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">&gt; 0 yielded) at offset θ</text><text x="430" y="497" text-anchor="start" style="font-size:22px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> = <tspan style="font-family:Times,serif;font-style:italic">c</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i</tspan><tspan dy="-7" style="font-size:10px"> </tspan>Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> μ <tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i,t−θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + <tspan style="font-family:Times,serif;font-style:italic">π</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan>,   <tspan style="font-family:Times,serif;font-style:italic">X</tspan> ≥ 0</text><text x="430" y="530" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">c: 1 for stock and orders, 0 for capacity · π: arrivals</text><rect x="420" y="586" width="410" height="204" rx="8" fill="#f3f4f6"/><text x="432" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="432" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">74 resources, 80 tasks, 180 edges</text><text x="432" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">121 weekly periods from 7 Sep 2026</text><text x="432" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Detail on the next slide</text><path class="wire" marker-end="url(#a)" d="M840 511.0 L877 511.0"/><rect x="880" y="222" width="330" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="900" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Scenario</text><text x="900" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">edits to 𝒪, rules, objective</text><text x="900" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edits to 𝒪</tspan>: opening levels, arrivals,</text><text x="918" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">run limits, delays θ</text><text x="900" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Rules</tspan>: permitted routes; task kinds</text><text x="918" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">the solver decides</text><text x="900" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Objective</tspan>: stock targets; priority</text><text x="918" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">order as ordered steps</text><text x="900" y="464" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Examples</text><text x="918" y="487" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">build time 2 weeks: delay θ</text><text x="918" y="510" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">closed for Christmas: capacity = 0</text><text x="918" y="533" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">RW-9304 first: priority order</text><rect x="890" y="586" width="310" height="204" rx="8" fill="#f3f4f6"/><text x="902" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="902" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">7 scenarios</text><text x="902" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">A, R, R+: build time none, 1 wk,</text><text x="918" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">by model; R+ is the plan</text><text x="902" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">On R+: Christmas closure, fleet</text><text x="918" y="734" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">order, lots of 50, priority order</text><path class="wire" marker-end="url(#a)" d="M1210 511.0 L1247 511.0"/><rect x="1250" y="222" width="290" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="1270" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Solver</text><text x="1270" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">method by problem structure</text><text x="1270" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">LP: build and transfer plans</text><text x="1270" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">MIP: lot sizes, set-ups,</text><text x="1288" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">minimum runs</text><text x="1270" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Heuristics: dispatch and</text><text x="1288" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">allocation rules</text><text x="1270" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Sampling: safety stock</text><text x="1288" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">under uncertainty</text><rect x="1260" y="586" width="270" height="204" rx="8" fill="#f3f4f6"/><text x="1272" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="1272" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">LP in HiGHS</text><text x="1272" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Variables: runs N ≥ 0</text><text x="1272" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Rows: one balance per</text><text x="1288" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">resource and period</text><text x="1272" y="734" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Objective: priority order</text><text x="1272" y="758" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">A: 13,068 variables, &lt; 0.2 s</text><text x="1272" y="782" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Lots: by rounding the LP</text><path class="wire" marker-end="url(#a)" d="M1540 511.0 L1577 511.0"/><rect x="1580" y="222" width="230" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="1600" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Plan</text><text x="1600" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">per scenario</text><text x="1600" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Runs N per task and</text><text x="1618" y="349" text-anchor="start" style="font-size:17px;fill:# "/><text x="1000" y="875" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Step 1 applies to every line, so road carbon’s mix changes in a few</text><text x="1000" y="899" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">early weeks.</text><line x1="940" y1="370" x2="940" y2="940" stroke="#e5e7eb" stroke-width="2"/><rect x="110" y="350" width="14" height="14" fill="#86b6ef"/><text x="130" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">size S</text><rect x="200" y="350" width="14" height="14" fill="#2a78d6"/><text x="220" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">size M</text><rect x="290" y="350" width="14" height="14" fill="#104281"/><text x="310" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">size L</text><polyline points="390.0,357.0 420.0,357.0" fill="none" stroke="#eb6834" stroke-width="2.2" stroke-linejoin="round"/><text x="428" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">forecast</text><polyline points="510.0,357.0 540.0,357.0" fill="none" stroke="#0b0b0b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="548" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">capacity</text><path d="M636 350 l7 7 l-7 7 l-7 -7 z" fill="#e34948"/><text x="650" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">open orders, month end</text><line x1="822" y1="350" x2="822" y2="364" stroke="#111827" stroke-width="1.4" stroke-dasharray="3 4"/><text x="832" y="362" text-anchor="start" style="font-size:14px;fill:#111827;font-weight:400">target held</text><line x1="110" y1="968" x2="1810" y2="968" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="1012" text-anchor="start" style="font-size:20px;fill:#111827;font-weight:400">A priority order changes the order in which bikes reach target, and nothing else.</text><text x="1810" y="1048" class="pg" text-anchor="end">12 / 13</text></svg><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text x="110" y="112" class="h1">Limits</text><text x="110" y="164" class="sub">What the plan assumes, and what it does not yet do.</text><line x1="110" y1="200" x2="1810" y2="200" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="260" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">ASSUMED, NOT IN THE DATA</text><text x="130" y="300" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Build times: 2 weeks on carbon lines, 1 on base lines; the</text><text x="130" y="327" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">data has no lead times.</text><text x="130" y="362" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Routes: stock at Reno and the PDC serves every order; the</text><text x="130" y="389" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">order files record no ship-from site.</text><text x="130" y="424" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">An order with no date is due 7 days after it was placed.</text><text x="130" y="459" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Forecast demand is taken as exact, and every change is known</text><text x="130" y="486" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">from week 1.</text><text x="1010" y="260" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">NOT BUILT</text><text x="1030" y="300" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Shipping is projected after the plan (oldest order first, as</text><text x="1030" y="327" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">soon as stock exists), not decided by it.</text><text x="1030" y="362" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Surprises: a change the plan learns of mid-horizon, with</text><text x="1030" y="389" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">earlier weeks frozen.</text><text x="1030" y="424" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Capacity beyond December 2028, so the last weeks build</text><text x="1030" y="451" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">nothing.</text><text x="1030" y="486" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Lots as an exact program (a MIP); today the LP plan is cut</text><text x="1030" y="513" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">into lots.</text><text x="1030" y="548" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Components and suppliers run on a small test, not on</text><text x="1030" y="575" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">Redwheel’s files, which hold none.</text><line x1="960" y1="236" x2="960" y2="760" stroke="#e5e7eb" stroke-width="2"/><line x1="110" y1="800" x2="1810" y2="800" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="846" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">WHERE IT IS WRITTEN</text><text x="110" y="880" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">docs/SOLVER.md (the program and what it decides) · docs/RANKED_WALK.md (the priority order) · docs/ASSUMPTIONS.md · docs/deck/deck_numbers.json (every number here)</text><line x1="110" y1="968" x2="1810" y2="968" stroke="#e5e7eb" stroke-width="2"/><text x="110" y="1012" text-anchor="start" style="font-size:24px;fill:#111827;font-weight:700">Next: we change the world live.</text><text x="1810" y="1048" class="pg" text-anchor="end">13 / 13</text></svg></body></html>
