="font-size:20px;fill:#111827;font-weight:700">Orders past their date</text><text x="398.8" y="572" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">every bike</text><circle cx="126" cy="607" r="15" fill="#6b7280"/><text x="126" y="612" text-anchor="middle" style="font-size:15px;fill:#fff;font-weight:700">2</text><text x="156" y="614" text-anchor="start" style="font-size:20px;fill:#111827;font-weight:700">All open orders</text><text x="326.0" y="614" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">every bike</text><circle cx="126" cy="649" r="15" fill="#b45309"/><text x="126" y="654" text-anchor="middle" style="font-size:15px;fill:#fff;font-weight:700">3</text><text x="156" y="656" text-anchor="start" style="font-size:20px;fill:#b45309;font-weight:700">RW-9304 to target</text><circle cx="126" cy="691" r="15" fill="#111827"/><text x="126" y="696" text-anchor="middle" style="font-size:15px;fill:#fff;font-weight:700">4</text><text x="156" y="698" text-anchor="start" style="font-size:20px;fill:#111827;font-weight:700">RW-4418 to target</text><circle cx="126" cy="733" r="15" fill="#2563eb"/><text x="126" y="738" text-anchor="middle" style="font-size:15px;fill:#fff;font-weight:700">5</text><text x="156" y="740" text-anchor="start" style="font-size:20px;fill:#2563eb;font-weight:700">RW-6416 to target</text><circle cx="126" cy="775" r="15" fill="#6b7280"/><text x="126" y="780" text-anchor="middle" style="font-size:15px;fill:#fff;font-weight:700">6</text><text x="156" y="782" text-anchor="start" style="font-size:20px;fill:#111827;font-weight:700">Other seven bikes to target</text><text x="110" y="836" text-anchor="start" style="font-size:23px;fill:#111827;font-family:Times,serif">step <tspan style="font-family:Times,serif;font-style:italic">s</tspan>:&#160;&#160;minimise <tspan style="font-family:Times,serif;font-style:italic">f</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">s</tspan><tspan dy="-7" style="font-size:10px"> </tspan>&#160;&#160;&#160;subject to&#160;&#160;<tspan style="font-family:Times,serif;font-style:italic">f</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">j</tspan><tspan dy="-7" style="font-size:10px"> </tspan>&#160;≤&#160;<tspan style="font-family:Times,serif;font-style:italic">f</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">j</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">*</tspan>&#160;&#160;for every earlier step <tspan style="font-family:Times,serif;font-style:italic">j</tspan></text><text x="110" y="866" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400"><tspan style="font-family:Times,serif;font-style:italic">f</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">s</tspan><tspan dy="-7" style="font-size:10px"> </tspan>: the shortfall step <tspan style="font-family:Times,serif;font-style:italic">s</tspan> measures.&#160;&#160;<tspan style="font-family:Times,serif;font-style:italic">f</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">j</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">*</tspan>: the minimum step <tspan style="font-family:Times,serif;font-style:italic">j</tspan> reached, now a constraint.</text><text x="110" y="906" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">RESULT</text><text x="110" y="938" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:400">Orders cleared 11 Jan 2027, as in R+.</text><text x="110" y="966" text-anchor="start" style="font-size:19px;fill:#111827;font-weight:400">RW-9304 at target <tspan font-weight="700">18 weeks sooner</tspan>, RW-4418 <tspan font-weight="700">3 weeks sooner</tspan>, RW-6416 on the same date.</text><line x1
