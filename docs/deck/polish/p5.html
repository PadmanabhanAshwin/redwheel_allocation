y="-7" style="font-size:10px"> </tspan> Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">g</tspan><tspan dy="-7" style="font-size:10px"> </tspan> max<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k∈g</tspan><tspan dy="-7" style="font-size:10px"> </tspan> <tspan style="font-family:Times,serif;font-style:italic">u</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + 0.1 Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k</tspan><tspan dy="-7" style="font-size:10px"> </tspan> <tspan style="font-family:Times,serif;font-style:italic">u</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">k,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="240" y="690" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Summed over weeks <tspan style="font-family:Times,serif;font-style:italic">t</tspan> and production lines <tspan style="font-family:Times,serif;font-style:italic">g</tspan>: the largest shortfall <tspan style="font-family:Times,serif;font-style:italic">u</tspan> among the</text><text x="240" y="712" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">SKUs <tspan style="font-family:Times,serif;font-style:italic">k</tspan> built on <tspan style="font-family:Times,serif;font-style:italic">g</tspan>. Second term: 0.1 × the sum of all shortfalls.</text><text x="110" y="752" text-anchor="start" style="font-size:23px;fill:#6b7280;font-family:Times,serif">subject to</text><text x="240" y="752" text-anchor="start" style="font-size:27px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">
