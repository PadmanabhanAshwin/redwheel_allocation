eight="176" rx="12" fill="rgb(249,242,237)"/><text x="1412" y="640" text-anchor="start" style="font-size:16px;fill:#b45309;font-weight:700">8</text><text x="1412" y="672" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:700">Ranked walk</text><text x="1412" y="702" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">objectives solved in</text><text x="1412" y="724" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">priority order</text><rect x="1608" y="600" width="196" height="176" rx="12" fill="rgb(249,242,237)"/><text x="1626" y="640" text-anchor="start" style="font-size:16px;fill:#b45309;font-weight:700">A1–A4</text><text x="1626" y="672" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:700">Appendix</text><text x="1626" y="702" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">build time; an</text><text x="1626" y="724" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">order; lots of 50;</text><text x="1626" y="746" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">R+P1</text><text x="110" y="900" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">Every number on these slides is read from docs/deck/deck_numbers.json, written by one run of every scenario through the product, with every plan check passing.</text></svg><svg width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text x="110" y="112" class="h1">Planning System – Data to Plan</text><text x="110" y="164" class="sub">Input data is encoded as a resource–task network; a scenario edits its parameters or objective; the LP solves it; the plan is read from the solution.</text><line x1="110" y1="200" x2="1810" y2="200" stroke="#e5e7eb" stroke-width="2"/><rect x="110" y="222" width="260" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="130" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Data</text><text x="130" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">inputs</text><text x="130" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Part master</text><text x="130" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Locations, routes</text><text x="130" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Inventory by location</text><text x="130" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Open orders, due dates</text><text x="130" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Demand forecast</text><text x="130" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Capacity</text><text x="130" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Lead times, targets</text><rect x="120" y="586" width="240" height="204" rx="8" fill="#f3f4f6"/><text x="132" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="132" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">10 SKUs on 4 lines</text><text x="132" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">2 sites, 3 channels</text><text x="132" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Routes and lead times</text><text x="132" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">assumed</text><path class="wire" marker-end="url(#a)" d="M370 511.0 L407 511.0"/><rect x="410" y="222" width="430" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="430" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Object  𝒪</text><text x="430" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">resource–task network</text><text x="430" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Resource</tspan> r: a quantity with a level X per period</text><text x="448" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">inventory, open orders, capacity</text><text x="430" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Task</tspan> i: an operation with N runs per period. A run</text><text x="448" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">consumes and yields resources at offsets θ: one</text><text x="448" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">resource into another, or the same one released</text><text x="430" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edge</tspan> (i, r): amount μ per run (&lt; 0 consumed,</text><text x="448" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">&gt; 0 yielded) at offset θ</text><text x="430" y="497" text-anchor="start" style="font-size:22px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> = <tspan style="font-family:Times,serif;font-style:italic">c</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i</tspan><tspan dy="-7" style="font-size:10px"> </tspan>Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> μ <tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i,t−θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + <tspan style="font-family:Times,serif;font-style:italic">π</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan>,   <tspan style="font-family:Times,serif;font-style:italic">X</tspan> ≥ 0</text><text x="430" y="530" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">c: 1 for stock and orders, 0 for capacity · π: arrivals</text><rect x="420" y="586" width="410" height="204" rx="8" fill="#f3f4f6"/><text x="432" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="432" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">74 resources, 80 tasks, 180 edges</text><text x="432" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">121 weekly periods from 7 Sep 2026</text><text x="432" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Detail on the next slide</text><path class="wire" marker-end="url(#a)" d="M840 511.0 L877 511.0"/><rect x="880" y="222" width="330" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="900" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Scenario</text><text x="900" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">edits to 𝒪, rules, objective</text><text x="900" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edits to 𝒪</tspan>: opening levels, arrivals,</text><text x="918" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">run limits, delays θ</text><text x="900" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Rules</tspan>: permitted routes; task kinds</text><text x="918" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">the solver decides</text><text x="900" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Objective</tspan>: stock targets; ranked</text><text x="918" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">objectives, solved in order</text><text x="900" y="464" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Examples</text><text x="918" y="487" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">build time 2 weeks: delay θ</text><text x="918" y="510" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">closed for Christmas: capacity = 0</text><text x="918" y="533" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">RW-9304 first: ranked objectives</text><rect x="890" y="586" width="310" height="204" rx="8" fill="#f3f4f6"/><text x="902" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="902" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">7 scenarios</text><text x="902" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">A, R, R+: build time none, 1 wk,</text><text x="918" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">by model; R+ is the plan</text><text x="902" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">On R+: Christmas closure, fleet</text><text x="918" y="734" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">order, lots of 50, ranked objectives</text><path class="wire" marker-end="url(#a)" d="M1210 511.0 L1247 511.0"/><rect x="1250" y="222" width="290" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="1270" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Solver</text><text x="1270" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">method by problem structure</text><text x="1270" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">LP: build and transfer plans</text><text x="1270" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">MIP: lot sizes, set-ups,</text><text x="1288" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">minimum runs</text><text x="1270" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Heuristics: dispatch and</text><text x="1288" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">allocation rules</text><text x="1270" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Sampling: safety stock</text><text x="1288" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">under uncertainty</text><rect x="1260" y="586" width="270" height="204" rx="8" fill="#f3f4f6"/><text x="1272" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="1272" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">LP in HiGHS</text><text x="1272" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Variables: runs N ≥ 0</text><text x="1272" y="686" text-anchor="start"
