r="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="132" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">10 SKUs on 4 lines</text><text x="132" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">2 sites, 3 channels</text><text x="132" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Routes and lead times</text><text x="132" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">assumed</text><path class="wire" marker-end="url(#a)" d="M370 511.0 L407 511.0"/><rect x="410" y="222" width="430" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="430" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Object  𝒪</text><text x="430" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">resource–task network</text><text x="430" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Resource</tspan> r: a quantity with a level X per period</text><text x="448" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">inventory, open orders, capacity</text><text x="430" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Task</tspan> i: an operation with N runs per period. A run</text><text x="448" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">consumes and yields resources at offsets θ: one</text><text x="448" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">resource into another, or the same one released</text><text x="430" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edge</tspan> (i, r): amount μ per run (&lt; 0 consumed,</text><text x="448" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">&gt; 0 yielded) at offset θ</text><text x="430" y="497" text-anchor="start" style="font-size:22px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> = <tspan style="font-family:Times,serif;font-style:italic">c</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r</tspan><tspan dy="-7" style="font-size:10px"> </tspan><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i</tspan><tspan dy="-7" style="font-size:10px"> </tspan>Σ<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> μ <tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">i,t−θ</tspan><tspan dy="-7" style="font-size:10px"> </tspan> + <tspan style="font-family:Times,serif;font-style:italic">π</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">r,t</tspan><tspan dy="-7" style="font-size:10px"> </tspan>,   <tspan style="font-family:Times,serif;font-style:italic">X</tspan> ≥ 0</text><text x="430" y="530" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">c: 1 for stock and orders, 0 for capacity · π: arrivals</text><rect x="420" y="586" width="410" height="204" rx="8" fill="#f3f4f6"/><text x="432" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="432" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">74 resources, 80 tasks, 180 edges</text><text x="432" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">121 weekly periods from 7 Sep 2026</text><text x="432" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Detail on the next slide</text><path class="wire" marker-end="url(#a)" d="M840 511.0 L877 511.0"/><rect x="880" y="222" width="330" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="900" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Scenario</text><text x="900" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">edits to 𝒪, rules, objective</text><text x="900" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Edits to 𝒪</tspan>: opening levels, arrivals,</text><text x="918" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">run limits, delays θ</text><text x="900" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Rules</tspan>: permitted routes; task kinds</text><text x="918" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">the solver decides</text><text x="900" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Objective</tspan>: stock targets; ranked</text><text x="918" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">objectives, solved in order</text><text x="900" y="464" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">Examples</text><text x="918" y="487" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">build time 2 weeks: delay θ</text><text x="918" y="510" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">closed for Christmas: capacity = 0</text><text x="918" y="533" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">RW-9304 first: ranked objectives</text><rect x="890" y="586" width="310" height="204" rx="8" fill="#f3f4f6"/><text x="902" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="902" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">7 scenarios</text><text x="902" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">A, R, R+: build time none, 1 wk,</text><text x="918" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">by model; R+ is the plan</text><text x="902" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">On R+: Christmas closure, fleet</text><text x="918" y="734" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">order, lots of 50, ranked objectives</text><path class="wire" marker-end="url(#a)" d="M1210 511.0 L1247 511.0"/><rect x="1250" y="222" width="290" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="1270" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Solver</text><text x="1270" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">method by problem structure</text><text x="1270" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">LP: build and transfer plans</text><text x="1270" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">MIP: lot sizes, set-ups,</text><text x="1288" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">minimum runs</text><text x="1270" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Heuristics: dispatch and</text><text x="1288" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">allocation rules</text><text x="1270" y="441" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Sampling: safety stock</text><text x="1288" y="464" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">under uncertainty</text><rect x="1260" y="586" width="270" height="204" rx="8" fill="#f3f4f6"/><text x="1272" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="1272" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">LP in HiGHS</text><text x="1272" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Variables: runs N ≥ 0</text><text x="1272" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Rows: one balance per</text><text x="1288" y="710" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">resource and period</text><text x="1272" y="734" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Objective: ranked objectives</text><text x="1272" y="758" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">A: 13,068 variables, &lt; 0.2 s</text><text x="1272" y="782" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Lots: by rounding the LP</text><path class="wire" marker-end="url(#a)" d="M1540 511.0 L1577 511.0"/><rect x="1580" y="222" width="230" height="578" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="1600" y="260" text-anchor="start" style="font-size:26px;fill:#111827;font-weight:700">Plan</text><text x="1600" y="286" text-anchor="start" style="font-size:17px;fill:#6b7280;font-weight:400">per scenario</text><text x="1600" y="326" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Runs N per task and</text><text x="1618" y="349" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">period: the build plan</text><text x="1600" y="372" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Levels X: stock, backlog</text><text x="1600" y="395" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Date each target is met</text><text x="1600" y="418" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">Feasibility checks</text><rect x="1590" y="586" width="210" height="204" rx="8" fill="#f3f4f6"/><text x="1602" y="612" text-anchor="start" style="font-size:15px;fill:#b45309;font-weight:700">Redwheel</text><text x="1602" y="638" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">R+: 94,429 bikes</text><text x="1602" y="662" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">all targets held from</text><text x="1602" y="686" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400">4 Oct 2027</text><rect x="110" y="822" width="730" height="176" rx="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="130" y="856" text-anchor="start" style="font-size:21px;fill:#111827;font-weight:700">Planning question</text><text x="130" y="896" text-anchor="start" style="font-size:30px;fill:#111827;font-family:Times,serif">q = (𝒪, σ, Ω),   answer = Ω(𝒪 | σ)</text><text x="130" y="926" text-anchor="start" style="font-size:15px;fill:#6b7280;font-weight:400">𝒪 object · σ scope: resources, tasks, horizon · Ω operator: project, decide, intervene, diagnose, evaluate</text><text x="130" y="958" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400"><tspan font-weight="700">Example</tspan>  R+C26: “every line closed for the weeks of 21 and 28 Dec 2026”</text><text x="130" y="982" text-anchor="start" style="font-size:16px;fill:#111827;font-weight:400">𝒪: the network · σ: all 4 lines, 121 weeks · Ω: intervene, decide, evaluate against R+</text><rect x="880" y="822" width="930" height="176" rx="12" fill="#fff" stroke="#b45309" stroke-width="2.5"/><text x="900" y="856" text-anchor="start" style="font-size:21px;fill:#b45309;font-weight:700">LLM interface <tspan style="fill:#6b7280;font-weight:400">(optional)</tspan></text><text x="900" y="892" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Input</tspan>  natural-language request → typed edit forms → validated in code → proposal for approval</text><text x="900" y="922" text-anchor="start" style="font-size:17px;fill:#111827;font-weight:400"><tspan font-weight="700">Output</tspan>  answers stated from computed results only</text><text x="900" y="958" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">No free-form model formulation: the LLM fills fixed forms; it does not write constraints or solve.</text><text x="900" y="982" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">No access to orders, stock or forecasts.</text><path d="M1045 822 L1045 803" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#g)"/><path d="M1695 803 L1695 820" stroke="#b45309" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#g)"/><text x="1810" y="1048" class="pg" text-anchor="end">1 / 8</text></svg></body></html>
