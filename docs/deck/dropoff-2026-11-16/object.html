="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t−1</tspan><tspan dy="-7" style="font-size:10px"> </tspan></tspan> + <tspan style="font-family:Times,serif;font-style:italic">π</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="240" y="782" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">State equation. <tspan style="font-family:Times,serif;font-style:italic">X</tspan>: resource levels. <tspan style="font-family:Times,serif;font-style:italic">N</tspan>: task runs. C: diagonal carry matrix.</text><text x="240" y="804" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">0</tspan><tspan dy="-7" style="font-size:10px"> </tspan>, A<tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:13px">1</tspan><tspan dy="-7" style="font-size:10px"> </tspan>: edge amounts by delay. π: exogenous arrivals.</text><text x="110" y="844" text-anchor="start" style="font-size:23px;fill:#6b7280;font-family:Times,serif"></text><text x="240" y="844" text-anchor="start" style="font-size:27px;fill:#111827;font-family:Times,serif"><tspan style="font-family:Times,serif;font-style:italic">X</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> ≥ 0, 0 ≤ <tspan style="font-family:Times,serif;font-style:italic">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan> ≤ <tspan style="font-family:Times,serif;font-style:italic;text-decoration:overline">N</tspan><tspan dy="7" dx="1" style="font-family:Times,serif;font-style:italic;font-size:19px">t</tspan><tspan dy="-7" style="font-size:10px"> </tspan></text><text x="240" y=" " height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111827"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><text x="110" y="112" class="h1">Scenarios A, R and R+</text><line x1="110" y1="200" x2="1810" y2="200" stroke="#e5e7eb" stroke-width="2"/><rect x="110.0" y="226" width="542.6666666666666" height="104" rx="12" fill="rgb(249,242,237)"/><text x="132.0" y="282" text-anchor="start" style="font-size:38px;fill:#111827;font-weight:700">94,429</text><text x="132.0" y="312" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">bikes in each scenario; identical totals per bike</text><rect x="676.6666666666666" y="226" width="542.6666666666666" height="104" rx="12" fill="rgb(249,242,237)"/><text x="698.6666666666666" y="282" text-anchor="start" style="font-size:38px;fill:#111827;font-weight:700">+2 weeks</text><text x="698.6666666666666" y="312" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">per scenario on every target date: 6 Sep, 20 Sep, 4 Oct 2027</text><rect x="1243.3333333333333" y="226" width="542.6666666666666" height="104" rx="12" fill="rgb(249,242,237)"/><text x="1265.3333333333333" y="282" text-anchor="start" style="font-size:38px;fill:#111827;font-weight:700">Carbon lines only</text><text x="1265.3333333333333" y="312" text-anchor="start" style="font-size:16px;fill:#6b7280;font-weight:400">shift from R to R+; base lines unchanged</text><text x="110" y="400" style="font-size:15px;font-weight:700;fill:#b45309;letter-spacing:1.5px">SCENARIO CONTEXT</text><circle cx="114" cy="426" r="3.2" fill="#111827"/><text x="130" y="432" text-anchor="start" style="font-size:18px;fill:#111827;font-weight:400">One network, one solver, one objective; three</text><text x="130" y="459" text-anch
